name: competitor-observation
services:
  db:
    ports:
      - '127.0.0.1:55432:5432'
  api:
    environment:
      OBSERVATION_ROOT: /workspace
      OBSERVATION_PUSH_DIR: /data/observation
    volumes:
      - ./:/workspace:ro
    ports:
      - '127.0.0.1:3301:3001'
  web:
    ports: !override
      - '127.0.0.1:3300:3000'
  collector:
    build: .
    image: aihot-app
    restart: unless-stopped
    user: root
    env_file: .env
    environment:
      AIHOT_API_BASE: http://api:3001
    volumes:
      - ./:/workspace:ro
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
      - ./reports:/workspace/reports
    command: ['python3','/workspace/monitor/run.py','--interval','3600']
    depends_on:
      api:
        condition: service_started
